name: "jii-prisma"
services:
  cloudsql-proxy:
    container_name: cloudsql-proxy
    image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:latest
    command: recidiviz-jii-staging:us-central1:jii --address 0.0.0.0 --port 5432 --credentials-file=/config/application_default_credentials.json
    restart: unless-stopped
    ports:
      - 127.0.0.1:5432:5432
    volumes:
      - ~/.config/gcloud:/config
  db:
    image: postgres:17
    environment:
      - POSTGRES_USER=${PGUSER}
      - POSTGRES_PASSWORD=${PGPASSWORD}
    ports:
      - ${DEV_PORT}:5432
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    healthcheck:
      test: ["CMD-SHELL", "pg_isready", "-U", "$${POSTGRES_USER}"]
      interval: 3s
      timeout: 1s
      retries: 5
  test-db:
    image: postgres:17
    environment:
      - POSTGRES_USER=${PGUSER}
      - POSTGRES_PASSWORD=${PGPASSWORD}
      - POSTGRES_DB=jii-test
    ports:
      - 6509:5432
    volumes:
      - postgres_data:/var/lib/postgresql/test-data/
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready", "-U", "postgres", "-d", "$${POSTGRES_DB}"]
      interval: 3s
      timeout: 1s
      retries: 5
  offline-db:
    image: postgres:17
    environment:
      - POSTGRES_USER=${PGUSER}
      - POSTGRES_PASSWORD=${PGPASSWORD}
      - POSTGRES_DB=jii-offline
    ports:
      - 6510:5432
    volumes:
      - postgres_data:/var/lib/postgresql/offline-data/
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready", "-U", "postgres", "-d", "$${POSTGRES_DB}"]
      interval: 3s
      timeout: 1s
      retries: 5

volumes:
  postgres_data:
