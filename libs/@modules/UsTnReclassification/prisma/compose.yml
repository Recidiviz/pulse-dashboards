name: "modules-UsTnReclassification-prisma"
services:
  db:
    image: postgres:17
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=module-UsTnReclassification
    ports:
      - 6542:5432
    volumes:
      - postgres_data:/var/lib/postgresql/data/
  test-db:
    image: postgres:17
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=module-UsTnReclassification-test
    ports:
      - 6543:5432
    volumes:
      - postgres_data:/var/lib/postgresql/test-data/

volumes:
  postgres_data:
