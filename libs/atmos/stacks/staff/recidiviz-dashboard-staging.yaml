# Staff dashboard serving infrastructure (Cloud CDN) for staging.
#
# Serves the built staff frontend (dist/apps/staff) from a private, CMEK-encrypted
# GCS bucket behind a global external load balancer with Cloud CDN, replacing
# Firebase Hosting. Runs on a test domain alongside Firebase until cutover.
settings:
  context:
    project_id: recidiviz-dashboard-staging
    project_number: 626425930051
    product: staff
    location: us-central1

# The variables set here are automatically provided to any components used in this stack.
vars:
  project_id: "{{ .settings.context.project_id }}"

import:
  - ../@defaults/terraform-backend

components:
  terraform:
    apps/staff-frontend:
      vars:
        environment: staging
        # Test domain — the real dashboard-staging.recidiviz.org stays on
        # Firebase Hosting until the CDN stack is validated; it gets appended
        # here at cutover (ROLLOUT.md Phase 4). DNS is managed outside this
        # repo; see the required_dns_records / cert_dns_authorization_records
        # outputs.
        domain_names:
          - dashboard-cdn-staging.recidiviz.org
          - dashboard-staging.recidiviz.org

        bucket_name: "{{.settings.context.project_id}}-staff-frontend"
        # Principals that upload builds and invalidate the CDN cache via
        # `yarn deploy`. Add engineers or the deploy SA
        # here as the rollout widens.
        deployer_members: []

    apps/staff-synthetic-monitor:
      vars:
        region: us-east1
        function_name: staff-synthetic-monitor
        staff_app_url: https://dashboard-staging.recidiviz.org

        # The states to monitor AND each state's credentials come from the
        # component's environments/staging/<STATE_CODE>.enc.yaml SOPS files
        # (one { username, password } map per state). State codes come from the
        # filenames; credentials are read ephemerally and written to Secret
        # Manager via write-only args. One function + two secrets + one uptime
        # check are created per state.

        # Absolute path to the workspace root, used by the component to locate
        # the nx-built function bundle at
        # $${workspace_root}/dist/apps/@staff/synthetic-monitor-fn. Read from
        # $NX_WORKSPACE_ROOT (set automatically by `nx deploy`); when running
        # atmos directly from libs/atmos it falls back to the repo root (two dirs
        # up from $PWD). TF validation fails loudly if it ends up empty.
        workspace_root: '{{ env.Getenv "NX_WORKSPACE_ROOT" (filepath.Dir (filepath.Dir (env.Getenv "PWD"))) }}'

        # Cadence: GCP caps uptime checks at 900s (15 min), so that's the slowest
        # we can run. Drives most of the cost (~225k -> ~75k runs/mo at 15 min).
        check_period: 900s

        # Step-by-step breadcrumbs to Cloud Logging while we stabilize the checks.
        # Flip to false for steady state.
        verbose_logging: true

        # Record a per-run HAR (network trace) and upload it to the screenshots
        # bucket on failure — for diagnosing slow/hung requests that don't surface
        # as outright failures. Heavier than verbose_logging; on while we stabilize.
        trace_logging: true

        # Outbound traffic egresses via a dedicated Serverless VPC connector +
        # Cloud NAT pinned to a reserved static IP (see the `egress_ip` output) so
        # the monitor logins can be IP-allowlisted in Auth0. Flip false to revert
        # to Google's shared serverless egress pool.
        static_egress_enabled: true

        # Alerting: a sustained synthetic-check failure pages on-call via the
        # shared PagerDuty forwarder + emails alerts@recidiviz.org. Set
        # `monitoring_enabled: false` to deploy the monitors without alerting.
        monitoring:
          alert_email: alerts@recidiviz.org
