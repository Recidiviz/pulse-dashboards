# Typesense search cluster for recidiviz-dashboard-production.
settings:
  context:
    project_id: recidiviz-dashboard-production
    # The core data-platform project — where staff-server's runtime SA
    # (dashboard-metrics-*) lives. Distinct from project_id above, which is the
    # dashboard project this Typesense stack deploys into.
    data_platform_project_id: recidiviz-123
    product: typesense
    location: us-central1
    fallback_location: us-east1
    secrets_filename: recidiviz-dashboard-production.enc.yaml

vars:
  project_id: "{{ .settings.context.project_id }}"

import:
  - ../@defaults/terraform-backend

components:
  terraform:
    apps/typesense:
      vars:
        region: "{{ .settings.context.location }}"

        # Allowlist the typesense-backfill function's static egress IP past the
        # Cloud Armor WAF + per-IP rate limit so it can bulk-import
        # faster. Sourced from that component's egress_ip output — apply
        # apps/typesense-backfill first so the output exists in its state.
        backfill_allowlist_ip_ranges:
          - !terraform.state apps/typesense-backfill egress_ip

        # Public endpoint. DNS (A record + cert-validation CNAME) is managed outside
        # this project — see the endpoint_ip / cert_dns_authorization_record outputs.
        hostname: typesense.recidiviz.org

        # Origins permitted to send browser requests directly to the cluster.
        # Production deliberately omits localhost — local dev points at the staging
        # cluster. Defense-in-depth on top of per-user scoped-key filtering.
        cors_domains:
          - https://dashboard.recidiviz.org

        # Refuse TLS < 1.2 handshakes at the Gateway frontend (GovRAMP AC-17(2))
        min_tls_version: TLS_1_2

        operator_chart_version: 0.4.1
        typesense_image: typesense/typesense:30.2

        node_machine_type: n2-highmem-4
        data_disk_size: 50Gi

        monitoring:
          alert_email: alerts@recidiviz.org
          # Production runs tighter (lower) thresholds than staging — page sooner.
          disk_alert_ratio: 0.80
          memory_alert_ratio: 0.85
          search_latency_alert_ms: 300
          pending_writes_alert: 50

    # Idles the slow-to-provision supporting infra (regional static IP, KMS key ring +
    # crypto keys, CMEK snapshot bucket, cert-DNS authorization, snapshotter GSA + WI
    # binding, Cloud Router/NAT) in a second region so a regional cutover is a
    # single var flip (mode: standby → mode: primary) + atmos apply.
    #
    # Failover playbook: RUNBOOK.md → "Regional outages".
    apps/typesense--secondary:
      metadata:
        component: apps/typesense
      vars:
        # Standby: supporting infra only (cluster + workloads + LB + monitoring +
        # CronJobs are all count = 0 in this mode). Flip to "primary" to fail over.
        mode: standby

        region: "{{ .settings.context.fallback_location }}"

        # Same hostname as the primary stack — the standby cert DNS authorization
        # is for this domain so the cert can validate immediately on failover.
        hostname: typesense.recidiviz.org

        # Mirror primary so the failover flip (mode: standby → primary + apply)
        # brings up CORS correctly without a second config edit.
        cors_domains:
          - https://dashboard.recidiviz.org

        # Mirror primary — the failover flip should come up with the same
        # TLS floor (GovRAMP AC-17(2)). No-op in standby (count = 0).
        min_tls_version: TLS_1_2

        operator_chart_version: 0.4.1
        typesense_image: typesense/typesense:30.2

        node_machine_type: n2-highmem-4
        data_disk_size: 50Gi

        # Unused in standby (monitoring policies are count=0)
        monitoring:
          alert_email: alerts@recidiviz.org
          # Production runs tighter (lower) thresholds than staging — page sooner.
          disk_alert_ratio: 0.80
          memory_alert_ratio: 0.85
          search_latency_alert_ms: 300
          pending_writes_alert: 50

    # The shared secrets component, which maps every key in the SOPS file to a
    # Secret Manager secret of the same name. Here that is one key,
    # typesense-write-api-key, which apps/typesense-backfill and apps/typesense-sync
    # below bind an accessor role against and mount as TYPESENSE_API_KEY. Apply this
    # before either of them: their bindings fail if the secret does not exist.
    #
    # Not the cluster bootstrap admin key. That one is the operator's root
    # credential, and apps/typesense wires it into the cluster pod from its own SOPS
    # file. Minting and rotating this key are documented there too, because you need
    # the admin key to do either.
    apps/typesense-api-key:
      metadata:
        component: secrets
      vars:
        sops_file: "sops/{{ .settings.context.secrets_filename }}"

        # Replication region for every secret in that file. Org policy forbids
        # "global" replication, so this must be a single US region rather than
        # "auto". One replica is enough: a lost replica is recoverable from the
        # SOPS value.
        location: us-east1

        deletion_policy: DELETE

    # Custom Cloud Function that bulk-imports the once-daily ETL'd collections
    # into Typesense. Pairs with apps/typesense-sync below: this one handles batch
    # sync for the collections the ETL rewrites wholesale, that one handles the
    # realtime patches a user writes.
    # See the component README for the why/how:
    # libs/atmos/components/terraform/apps/typesense-backfill/README.md
    apps/typesense-backfill:
      vars:
        # Match the Firestore's region so traffic stays local. nam5 is a US
        # multi-region — us-east1 is the closest single Cloud Functions region
        # and mirrors staging.
        region: us-east1

        firestore_database: (default)

        typesense_host: typesense.recidiviz.org

        # Absolute path to the workspace root, used by the component to
        # locate the nx-built function bundle at
        # $${workspace_root}/dist/apps/@typesense/backfill-fn. Read from
        # $NX_WORKSPACE_ROOT (set automatically by `nx deploy`); TF validation
        # in the component fails loudly if it's empty.
        workspace_root: '{{ env.Getenv "NX_WORKSPACE_ROOT" }}'

        # Same source-of-truth as the typesense client schema
        collections: !exec yarn tsx ../../libs/@typesense/client/src/export-collections.ts

        # Pin outbound traffic to a reserved static IP (via VPC connector + Cloud
        # NAT) so the typesense Cloud Armor policy can allowlist this function past
        # its per-IP rate limit. The egress_ip output is wired into apps/typesense's
        # backfill_allowlist_ip_ranges above. Apply this component BEFORE apps/typesense
        # so the egress_ip output exists when that stack resolves !terraform.state.
        static_egress_enabled: true

        # SAs granted roles/run.invoker on this function so they can trigger a
        # backfill via an authenticated OIDC request. Both live in the
        # data-platform project (data_platform_project_id), not this dashboard
        # project — cross-project member bindings are fine.
        #   - dashboard-metrics-*: staff-server's GOOGLE_APPLICATION_CREDENTIALS_JSON
        #     identity (gae-production.enc.yaml), backing POST /api/typesense/backfill.
        #   - application-data-import-cr: the data-import Cloud Run SA that fires
        #     the per-state backfill after its ETL completes (defined in another repo).
        invoker_members:
          - serviceAccount:dashboard-metrics-production@{{ .settings.context.data_platform_project_id }}.iam.gserviceaccount.com
          - serviceAccount:application-data-import-cr@{{ .settings.context.data_platform_project_id }}.iam.gserviceaccount.com

    # Firestore-triggered Cloud Functions that patch user-written updates onto
    # the Typesense record they update — preferredName onto clients/residents,
    # officer-action fields onto opportunities. Partial updates, so they don't
    # clobber the ETL fields the backfill above owns. Composes a doc id from the
    # ancestor path, and writes part of a document rather than all of it.
    # See the component README for the full why:
    # libs/atmos/components/terraform/apps/typesense-sync/README.md
    apps/typesense-sync:
      vars:
        # Region the functions run in. Mirrors the backfill function.
        region: us-east1

        # Eventarc trigger location — must be the FIRESTORE database's location.
        # Production Firestore is the nam5 multi-region, NOT us-east1: setting
        # this to the run region creates triggers that never fire.
        firestore_database_location: nam5

        firestore_database: (default)

        typesense_host: typesense.recidiviz.org

        # Absolute path to the workspace root, used by the component to locate
        # the nx-built function bundle at
        # $${workspace_root}/dist/apps/@typesense/sync-fn. Read from
        # $NX_WORKSPACE_ROOT (set automatically by `nx deploy`); TF validation
        # in the component fails loudly if it's empty.
        workspace_root: '{{ env.Getenv "NX_WORKSPACE_ROOT" }}'
