settings:
  context:
    project_id: recidiviz-dashboard-production
    project_number: 13012629248
    location: us-central1
    product: product-modules

# The variables set here are automatically provided to any components used in this stack.
vars:
  project_id: "{{ .settings.context.project_id }}"
  location: "{{ .settings.context.location }}"

import:
  - ../@defaults/terraform-backend
  - ../@defaults/vendor/artifact-registry

components:
  terraform:
    apps/product-modules:
      settings:
        # Note: with the way we have atmos set up, this depends_on doesn't actually do anything.
        # It's here mainly as documentation for the user.
        depends_on:
          shared_infra:
            component: apps/shared-infra
            stack: recidiviz-dashboard-production--shared-infra
      vars:
        artifact_registry_repo: '{{ (atmos.Component "apps/product-modules" "recidiviz-dashboard-staging--product-modules").vars.artifact_registry_repo }}'
        artifact_registry_project_id: '{{ (atmos.Component "apps/product-modules" "recidiviz-dashboard-staging--product-modules").vars.project_id }}'
        deploy_environment: production
        server_url: modules.recidiviz.org
        waf_id: !terraform.state apps/shared-infra recidiviz-dashboard-production--shared-infra shared_waf_id
        private_network: projects/recidiviz-dashboard-production/global/networks/default
