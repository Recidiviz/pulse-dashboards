settings:
  context:
    project_id: recidiviz-dashboard-staging
    project_number: 626425930051
    location: us-central1
    product: product-modules

# The variables set here are automatically provided to any components used in this stack.
vars:
  project_id: "{{ .settings.context.project_id }}"
  location: "{{ .settings.context.location }}"

import:
  - ../@defaults/terraform-backend
  - ../@defaults/vendor/artifact-registry

components:
  terraform:
    artifact_registry:
      vars:
        project_id: "{{ .settings.context.project_id }}"
        location: "{{ .settings.context.location }}"
        repository_id: "{{ .settings.context.product }}"

    apps/product-modules:
      settings:
        # Note: with the way we have atmos set up, this depends_on doesn't actually do anything.
        # It's here mainly as documentation for the user.
        depends_on:
          shared_infra:
            component: apps/shared-infra
            stack: recidiviz-dashboard-staging--shared-infra
      vars:
        artifact_registry_repo: '{{ .settings.context.location }}-docker.pkg.dev/{{ .settings.context.project_id }}/{{ (atmos.Component "artifact_registry" .stack).outputs.artifact_name }}'
        artifact_registry_project_id: "{{ .settings.context.project_id }}"
        deploy_environment: staging
        server_url: modules-staging.recidiviz.org
        waf_id: !terraform.state apps/shared-infra recidiviz-dashboard-staging--shared-infra shared_waf_id
