settings:
  context:
    project_id: recidiviz-rnd-planner
    project_number: 773019812766
    data_platform_project_id: recidiviz-123
    product: reentry
    location: us-central1

# The variables set here are automatically provided to any components used in this stack.
vars:
  project_id: "{{ .settings.context.project_id }}"
  location: "{{ .settings.context.location }}"

import:
  - ../@defaults/terraform-backend

components:
  terraform:
    postgres-bq-data-transfer:
      vars:
        dataset_name: reentry_db
        tables:
          - intake
          - plan
          - planasset
          - plangeneration
          - assessment
        service_account_email: "{{ .settings.context.project_number }}-compute@developer.gserviceaccount.com"
        postgresql:
          host: !terraform.state cloud-sql-proxy recidiviz-rnd-planner--shared-infra cloud_sql_proxy_ip
          port: !terraform.state cloud-sql-proxy recidiviz-rnd-planner--shared-infra ".ports[""recidiviz-prod""]"
          username: !store.get rnd-planner-direct RECIDIVIZ_POSTGRES_USERNAME
          password: !store.get rnd-planner-direct RECIDIVIZ_POSTGRES_PASSWORD_PROD
          databases:
            - recidiviz

    postgres-bq-data-transfer-staging:
      vars:
        dataset_name: reentry_staging_db
        tables:
          - intake
          - plan
          - planasset
          - plangeneration
          - assessment
        service_account_email: "{{ .settings.context.project_number }}-compute@developer.gserviceaccount.com"
        postgresql:
          host: !terraform.state cloud-sql-proxy recidiviz-rnd-planner--shared-infra cloud_sql_proxy_ip
          port: !terraform.state cloud-sql-proxy recidiviz-rnd-planner--shared-infra ".ports[""recidiviz-staging""]"
          username: !store.get rnd-planner-direct RECIDIVIZ_POSTGRES_USERNAME
          password: !store.get rnd-planner-direct RECIDIVIZ_POSTGRES_PASSWORD_STAGING
          databases:
            - recidiviz
      metadata:
        component: postgres-bq-data-transfer

    # Memorystore with AUTH + TLS, replacing the unauthenticated instances (AUR-216).
    # Each environment is its own component instance, so it has its own state and can't be
    # replaced by a plan against another environment.
    # Sizing and version match the instance each one replaces (redis-dev, redis-staging, ...).
    reentry-redis/defaults:
      metadata:
        type: abstract
        component: apps/reentry-redis
      vars:
        tier: BASIC
        memory_size_gb: 1

    reentry-redis-dev:
      metadata:
        component: apps/reentry-redis
        inherits: [reentry-redis/defaults]
      vars:
        environment: DEV
        redis_version: REDIS_7_2
        instance_name: reentry-redis-dev
        secret_accessors:
          - "{{ .settings.context.project_number }}-compute@developer.gserviceaccount.com"

    reentry-redis-staging:
      metadata:
        component: apps/reentry-redis
        inherits: [reentry-redis/defaults]
      vars:
        environment: STAGING
        redis_version: REDIS_7_0
        instance_name: reentry-redis-staging
        secret_accessors:
          - reentry-server-staging@recidiviz-rnd-planner.iam.gserviceaccount.com
          # Cloud Run jobs run as the default compute account in every environment
          - "{{ .settings.context.project_number }}-compute@developer.gserviceaccount.com"

    reentry-redis-demo:
      metadata:
        component: apps/reentry-redis
        inherits: [reentry-redis/defaults]
      vars:
        environment: DEMO
        redis_version: REDIS_7_0
        instance_name: reentry-redis-demo
        secret_accessors:
          - "{{ .settings.context.project_number }}-compute@developer.gserviceaccount.com"

    reentry-redis-pilot:
      metadata:
        component: apps/reentry-redis
        inherits: [reentry-redis/defaults]
      vars:
        environment: PILOT
        redis_version: REDIS_7_2
        instance_name: reentry-redis-pilot
        secret_accessors:
          - "{{ .settings.context.project_number }}-compute@developer.gserviceaccount.com"

    reentry-redis-prod:
      metadata:
        component: apps/reentry-redis
        inherits: [reentry-redis/defaults]
      vars:
        environment: PROD
        tier: STANDARD_HA
        redis_version: REDIS_7_0
        instance_name: reentry-redis-prod
        secret_accessors:
          - reentry-server@recidiviz-rnd-planner.iam.gserviceaccount.com
          - "{{ .settings.context.project_number }}-compute@developer.gserviceaccount.com"
